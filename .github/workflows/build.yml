
name: PowerTools Build & Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Package PowerTools
    runs-on: ubuntu-latest

    steps:
      - name: Download Repository
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Prepare Maven Project
        run: |
          mkdir -p src/main/java/de/powersmp/powertools
          mkdir -p src/main/resources
          mkdir -p lib

          if [ -f PowerTools.java ]; then
            cp PowerTools.java src/main/java/de/powersmp/powertools/
          fi

          if [ -f config.yml ]; then
            cp config.yml src/main/resources/
          fi

          if [ -f plugin.yml ]; then
            cp plugin.yml src/main/resources/
          fi

          if [ -f PowerEco.jar ]; then
            cp PowerEco.jar lib/PowerEco.jar
          fi

          echo "Project structure prepared."
          find src lib -type f

      - name: Verify Required Files
        run: |
          test -f pom.xml
          test -f src/main/java/de/powersmp/powertools/PowerTools.java
          test -f src/main/resources/plugin.yml
          test -f lib/PowerEco.jar

      - name: Compile Plugin
        run: mvn --batch-mode --errors clean package

      - name: Prepare Release
        run: |
          mkdir -p release
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name 'original-*.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" release/PowerTools.jar

          if [ -d resourcepack ] && [ -f resourcepack/pack.mcmeta ]; then
            cd resourcepack
            zip -r ../release/PowerTools-ResourcePack.zip .
            cd ..
          fi

          cp README.md release/ 2>/dev/null || true
          cp README.txt release/ 2>/dev/null || true

          cd release
          zip -r ../PowerTools-Release.zip .
          cd ..

      - name: Upload Final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-Release
          path: PowerTools-Release.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PowerTools-JAR
          path: release/PowerTools.jar
          if-no-files-found: error
          retention-days: 30
